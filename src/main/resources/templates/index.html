<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fog Header</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            background: #fff;
        }

        .logo {
            background: #0b3a6e;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 15px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            margin-left: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .search-container {
            flex: 1;
            display: flex;
            justify-content: center;
            margin: 0 20px;
        }

        .search-box {
            width: 60%;
            display: flex;
            border: 1px solid #ccc;
            border-radius: 3px;
            overflow: hidden;
        }

        .search-box input {
            flex: 1;
            padding: 8px;
            border: none;
            outline: none;
        }

        .search-box button {
            background: #0b3a6e;
            color: #fff;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
        }

        .icons {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .icons div {
            cursor: pointer;
        }

        .info-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 13px;
            padding: 8px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="info-bar">
    <div>30 dages returret</div>
    <div>Klik og hent inden for 3 timer*</div>
    <div>1-3 dages levering*</div>
    <div>Lån en trailer gratis</div>
</div>

<div class="top-bar">
    <div class="logo">Fog</div>

    <div class="nav-links">
        <a href="#">Bolig & design</a>
        <a href="#">Byggematerialer</a>
        <a href="#">El & belysning</a>
        <a href="#">Have & fritid</a>
        <a href="#">Værktøj</a>
        <a href="#">Mærker</a>
        <a href="#">Tilbud</a>
        <a href="#">Fog Pro</a>
    </div>

    <div class="search-container">
        <div class="search-box">
            <button>🔍</button>
            <input type="text" placeholder="Søgning">
        </div>
    </div>

    <div class="icons">
        <div>👤 Fog Konto</div>
        <div>📍 Find os</div>
        <div>🛒 Kurv</div>
    </div>
</div>

</body>
</html>
