<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <title>Fog Carport Form</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

</head>
<body>

<!-- Header with logo and buttons -->
<header>
    <div class="header">
        <div class="logoplace">
            <a th:href="@{/carportSkaber}">
                <img src="/img/Fog.png" class="logoSize">
            </a>
        </div>

         <ul class="menu">
            <li><a th:href="@{/myOrders}">Mine ordre</a></li>
            <li><a th:href="@{/logout}">Log ud</a></li>
         </ul>

    </div>
</header>

<!-- Main container -->
<div class="selector-container">
    <div class="form-box">

        <!-- Popup besked -->
        <div th:if="${successMessage}" class="popup">
            <p th:text="${successMessage}"></p>
        </div>

        <form th:action="@{/order}" method="post">

            <h2>Carport med fladt tag</h2>

            <p>
                Indtast dine ansøgte mål til din carport og indsend din forespørgsel,
                og så vil vi hurtigst muligt vende tilbage med et tilbud til dig
            </p>

            <div class="form-group">
                <label for="length">Carport længde</label>

                <select id="length" name="length">
                    <option value="">Vælg længde</option>
                    <option value="240">240 cm</option>
                    <option value="270">270 cm</option>
                    <option value="300">300 cm</option>
                    <option value="330">330 cm</option>
                    <option value="360">360 cm</option>
                    <option value="390">390 cm</option>
                    <option value="420">420 cm</option>
                    <option value="450">450 cm</option>
                    <option value="480">480 cm</option>
                    <option value="510">510 cm</option>
                    <option value="540">540 cm</option>
                    <option value="570">570 cm</option>
                    <option value="600">600 cm</option>
                    <option value="630">630 cm</option>
                    <option value="660">660 cm</option>
                    <option value="690">690 cm</option>
                    <option value="720">720 cm</option>
                    <option value="750">750 cm</option>
                    <option value="780">780 cm</option>
                </select>
            </div>

            <div class="form-group">
                <label for="width">Carport bredde</label>

                <select id="width" name="width">
                    <option value="">Vælg bredde</option>
                    <option value="240">240 cm</option>
                    <option value="270">270 cm</option>
                    <option value="300">300 cm</option>
                    <option value="330">330 cm</option>
                    <option value="360">360 cm</option>
                    <option value="390">390 cm</option>
                    <option value="420">420 cm</option>
                    <option value="450">450 cm</option>
                    <option value="480">480 cm</option>
                    <option value="510">510 cm</option>
                    <option value="540">540 cm</option>
                    <option value="570">570 cm</option>
                    <option value="600">600 cm</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">
                Indsend forespørgsel
            </button>

        </form>
    </div>
</div>

</body>
</html>
