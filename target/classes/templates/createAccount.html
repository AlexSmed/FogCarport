<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>CreateAccount</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>


<header>
    <div class="header">

        <div class="logoplace">
            <a th:href="@{/login}">
                <img src="/img/Fog.png" class="logoSize">
            </a>
        </div>

        <ul class="menu">
            <li><a th:href="@{/login}">Login</a></li>
            <li><a th:href="@{/createAccount}">Opret bruger</a></li>
        </ul>

    </div>
</header>
<main>
    <div class="login-container">
        <h2>Opret Bruger</h2>

        <form th:action="@{/createAccount}" method="post">
            <p th:text="${msg}"></p>
            <div class="input-group">
                <label for="firstname">Fornavn</label>
                <input type="text" id="firstname" name="firstname" required>
            </div>
            <div class="input-group">
                <label for="lastname">Efternavn</label>
                <input type="text" id="lastname" name="lastname" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="by">By</label>
                <input type="text" id="by" name="by" required>
            </div>

            <div class="input-group">
                <label for="postNummer">Post Nummer</label>
                <input type="text" id="postNummer" name="postNummer" required>
            </div>

            <div class="input-group">
                <label for="adresse">Adresse</label>
                <input type="text" id="adresse" name="adresse" required>
            </div>


            <button type="submit">Opret bruger</button>

        </form>
    </div>


</main>

</body>

</html>
