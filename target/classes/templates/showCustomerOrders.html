<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Mine ordre</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header>
    <div class="header">
        <div class="logoplace">
            <a th:href="@{/carportSkaber}">
                <img src="/img/Fog.png" class="logoSize">
            </a>
        </div>

        <ul class="menu">
            <li><a th:href="@{/carportSkaber}"> Lav carport</a></li>
            <li><a th:href="@{/myOrders}">Mine ordre</a></li>
            <li><a th:href="@{/logout}">Log ud</a></li>
        </ul>

    </div>
</header>

<div class="container">
    <h1>Mine ordre</h1>

    <p th:if="${message}" th:text="${message}" class="message"></p>

    <table class="order-table">
        <tr>
            <th>Ordre ID</th>
            <th>Længde</th>
            <th>Bredde</th>
            <th>Pris</th>
            <th>Status</th>
            <th>Se stykliste</th>
            <th>Handling</th>
        </tr>

        <tr th:each="order : ${orders}">
            <td th:text="${order.carport_id}"></td>
            <td th:text="${order.carport_bredde}"></td>
            <td th:text="${order.carport_laengde}"></td>
            <td th:text="${order.pris} + ' kr'"></td>
            <td th:text="${order.status}"></td>


            <td>
                <form th:action="@{/seStykliste}" method="get"
                      th:if="${order.status == 'BETALT'}">

                    <input type="hidden" name="stykliste_id"
                           th:value="${order.stykliste_id}">

                    <button type="submit">Stykliste</button>
                </form>
            </td>

            <td>
                <form th:action="@{/payOrder}" method="post">
                    <input type="hidden" name="orderId" th:value="${order.carport_id}">
                    <button type="submit" th:if="${order.status != 'BETALT'}">Betal</button>
                    <span th:if="${order.status == 'BETALT'}">✔ Betalt</span>
                </form>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
